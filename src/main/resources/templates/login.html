<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SFG Biasca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
        --red:    #D0211C;
        --yellow: #F5C518;
        --blue:   #1A4F9C;
        --dark:   #111827;
        --light:  #F9F8F5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        display: flex;
        font-family: 'Barlow', sans-serif;
        background: var(--dark);
    }

    /* ── SINISTRA — decorativa ── */
    .login-left {
        display: none;
        position: relative;
        overflow: hidden;
        background: var(--blue);
    }
    @media (min-width: 992px) {
        .login-left { display: flex; flex: 1; flex-direction: column; justify-content: flex-end; padding: 3rem; }
    }

    /* Strisce diagonali decorative */
    .stripe {
        position: absolute;
        top: -10%;
        width: 120px;
        height: 130%;
        opacity: 0.15;
        transform: rotate(-15deg);
    }
    .stripe-1 { background: var(--red);    left: 15%; }
    .stripe-2 { background: var(--yellow); left: 35%; width: 80px; }
    .stripe-3 { background: #fff;          left: 50%; width: 60px; }

    .login-left-logo {
        position: absolute;
        top: 2.5rem;
        left: 2.5rem;
        background: rgba(255,255,255,0.92);
        border-radius: 50%;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .login-left-logo img { width: 56px; height: 56px; object-fit: contain; }

    .login-left-text { position: relative; z-index: 2; }
    .login-left-text h2 {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
        line-height: 1;
    }
    .login-left-text h2 span { color: var(--yellow); }
    .login-left-text p {
        color: rgba(255,255,255,0.6);
        font-size: 0.85rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-top: 0.5rem;
    }

    /* Striscia tricolore in fondo */
    .tricolor {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--red) 33%, var(--yellow) 33% 66%, var(--blue) 66%);
    }

    /* ── DESTRA — form ── */
    .login-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2.5rem 2rem;
        background: var(--light);
        width: 100%;
    }
    @media (min-width: 992px) {
        .login-right { width: 460px; flex-shrink: 0; }
    }

    .login-box { width: 100%; max-width: 360px; }

    /* Logo mobile */
    .login-logo-mobile {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
    }
    .login-logo-mobile img {
        height: 70px;
        width: auto;
    }
    @media (min-width: 992px) {
        .login-logo-mobile { display: none; }
    }

    .login-box h1 {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--dark);
        margin-bottom: 0.25rem;
    }
    .login-box p.subtitle {
        color: #6B7280;
        font-size: 0.85rem;
        margin-bottom: 2rem;
    }

    /* Alert errore */
    .alert-login {
        background: #FEE2E2;
        border: 1px solid #FECACA;
        border-left: 3px solid var(--red);
        border-radius: 4px;
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
        color: #991B1B;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    /* Campi form */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--dark);
        margin-bottom: 0.4rem;
    }
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1.5px solid #E5E7EB;
        border-radius: 4px;
        font-family: 'Barlow', sans-serif;
        font-size: 0.95rem;
        background: #fff;
        color: var(--dark);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
    }
    .form-control:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(26, 79, 156, 0.12);
    }

    /* Bottone login */
    .btn-login {
        width: 100%;
        padding: 0.85rem;
        background: var(--blue);
        color: #fff;
        border: none;
        border-radius: 4px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s;
        margin-top: 0.5rem;
    }
    .btn-login:hover {
        background: #153f7a;
        transform: translateY(-1px);
    }
    .btn-login:active { transform: translateY(0); }

    /* Link torna al sito */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 2rem;
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #6B7280;
        text-decoration: none;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--blue); }

    /* Animazione entrata */
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .login-box { animation: fadeUp 0.5s ease both; }
  </style>
</head>
<body>

<!-- SINISTRA decorativa (solo desktop) -->
<div class="login-left">
  <div class="stripe stripe-1"></div>
  <div class="stripe stripe-2"></div>
  <div class="stripe stripe-3"></div>

  <div class="login-left-logo">
    <img th:src="@{/img/logo_sfg.png}" src="/img/logo_sfg.png" alt="SFG Biasca">
  </div>

  <div class="login-left-text">
    <h2>Area<br><span>Riservata</span></h2>
    <p>SFG Biasca — Pannello Admin</p>
  </div>

  <div class="tricolor"></div>
</div>

<!-- DESTRA — form -->
<div class="login-right">
  <div class="login-box">

    <!-- Logo mobile -->
    <div class="login-logo-mobile">
      <img th:src="@{/img/logo_sfg.png}" src="/img/logo_sfg.png" alt="SFG Biasca">
    </div>

    <h1>Accedi</h1>
    <p class="subtitle">Inserisci le tue credenziali per continuare</p>

    <!-- Errore login -->
    <div class="alert-login" th:if="${param.error}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Email o password non corretti.
    </div>

    <!-- Messaggio logout -->
    <div class="alert-login" style="background:#F0FDF4; border-color:#BBF7D0; border-left-color:#16A34A; color:#166534;"
         th:if="${param.logout}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Logout effettuato con successo.
    </div>

    <!-- FORM — Spring Security intercetta /login POST -->
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control"
               type="email"
               id="email"
               name="username"
               placeholder="mario.rossi@sfgbiasca.ch"
               required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control"
               type="password"
               id="password"
               name="password"
               placeholder="••••••••"
               required>
      </div>

      <button type="submit" class="btn-login">Accedi</button>
    </form>

    <a th:href="@{/}" href="/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Torna al sito
    </a>

  </div>
</div>

</body>
</html>
